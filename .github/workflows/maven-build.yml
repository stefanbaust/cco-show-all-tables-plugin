# This workflow will build a package using Maven and then add it to release downloads
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write  # Changed from 'read' to 'write' to allow uploading release assets
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Build with Maven
        run: mvn -s $GITHUB_WORKSPACE/azure-mvn-settings.xml -B package --file pom.xml
        env:
          AZURE_SB_PERSONAL_ACCESS_TOKEN: ${{ secrets.AZURE_SB_PERSONAL_ACCESS_TOKEN }}

      - name: Upload Shaded JAR to Release
        run: |
          # Find the shaded JAR (exclude the one with "original-" prefix)
          SHADED_JAR=$(find ./target -name "*.jar" ! -name "original-*.jar" | head -1)
          
          echo "Uploading JAR: $SHADED_JAR"
          
          # Upload using GitHub CLI
          gh release upload ${{ github.event.release.tag_name }} "$SHADED_JAR" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

